cd C:\Users\hp\Desktop\todo-app\frontend @'
<!DOCTYPE html>
<html>
  <head>
    <title>TODO-IT API Test</title>
    <style>
      body {
        font-family: Arial;
        padding: 20px;
      }
      .test {
        margin: 10px 0;
        padding: 10px;
        border: 1px solid #ccc;
      }
      .success {
        background: #d4edda;
      }
      .error {
        background: #f8d7da;
      }
      button {
        margin: 5px;
        padding: 8px 16px;
      }
    </style>
  </head>
  <body>
    <h1>🔧 TODO-IT API Test</h1>

    <div class="test">
      <h3>Test 1: Check API Connection</h3>
      <button onclick="testConnection()">Test Connection</button>
      <div id="connectionResult"></div>
    </div>

    <div class="test">
      <h3>Test 2: Create Test Task</h3>
      <button onclick="createTask()">Create Test Task</button>
      <div id="createResult"></div>
    </div>

    <div class="test">
      <h3>Test 3: List All Tasks</h3>
      <button onclick="listTasks()">List Tasks</button>
      <div id="listResult"></div>
    </div>

    <script>
      const API_URL = "http://localhost:3000/api/todos";

      async function testConnection() {
        try {
          const response = await fetch(API_URL);
          const result = document.getElementById("connectionResult");
          if (response.ok) {
            result.innerHTML =
              '<span style="color:green">✅ API Connected!</span>';
            result.className = "test success";
          } else {
            result.innerHTML = `<span style="color:red">❌ API Error: ${response.status}</span>`;
            result.className = "test error";
          }
        } catch (error) {
          const result = document.getElementById("connectionResult");
          result.innerHTML = `<span style="color:red">❌ Connection Failed: ${error.message}</span>`;
          result.className = "test error";
        }
      }

      async function createTask() {
        try {
          const response = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              title: "Test Task",
              description: "Created from test page",
              completed: false,
            }),
          });

          const result = document.getElementById("createResult");
          if (response.ok) {
            const data = await response.json();
            result.innerHTML = `<span style="color:green">✅ Task Created! ID: ${data.id}</span>`;
            result.className = "test success";
          } else {
            result.innerHTML = `<span style="color:red">❌ Failed to create: ${response.status}</span>`;
            result.className = "test error";
          }
        } catch (error) {
          const result = document.getElementById("createResult");
          result.innerHTML = `<span style="color:red">❌ Error: ${error.message}</span>`;
          result.className = "test error";
        }
      }

      async function listTasks() {
        try {
          const response = await fetch(API_URL);
          const result = document.getElementById("listResult");
          if (response.ok) {
            const tasks = await response.json();
            result.innerHTML = `<span style="color:green">✅ Found ${tasks.length} tasks</span><br>`;
            tasks.forEach((task) => {
              result.innerHTML += `- ${task.title} (ID: ${task.id})<br>`;
            });
            result.className = "test success";
          } else {
            result.innerHTML = `<span style="color:red">❌ Failed to list: ${response.status}</span>`;
            result.className = "test error";
          }
        } catch (error) {
          const result = document.getElementById("listResult");
          result.innerHTML = `<span style="color:red">❌ Error: ${error.message}</span>`;
          result.className = "test error";
        }
      }

      // Auto-test on load
      window.onload = testConnection;
    </script>
  </body>
</html>
'@ | Out-File -FilePath "api-test.html" -Encoding UTF8 # Open the test page
start api-test.html
